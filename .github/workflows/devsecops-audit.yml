name: COMMERCIA DevSecOps Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: 🛡️ Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  sca-audit:
    name: 📦 Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Run Backend NPM Audit
        run: |
          cd backend
          npm audit --audit-level=high || true

      - name: Run Frontend NPM Audit
        run: |
          cd frontend
          npm audit --audit-level=high || true

  security-tests:
    name: 🔒 Automated Security Hardening Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
      JWT_SECRET: "ci_cd_test_jwt_secret_must_be_very_long_and_complex_12345"
      ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NODE_ENV: "production"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Execute Security & Cryptographic Tests
        run: |
          cd backend
          npx ts-node tests/securityHardening.test.ts

  build-verification:
    name: 🏗️ Secure Build & Type Safety
    runs-on: ubuntu-latest
    needs: [security-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Backend
        run: |
          cd backend
          npm ci || npm install
          npx prisma generate
          npm run build

      - name: Build Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
